; Host-only test configuration; the firmware configuration stays unchanged.
; Run from the repository root:
; pio test --project-conf test/platformio.ini -e native
[platformio]
src_dir = lib/button
test_dir = test
lib_dir = test/unused-libraries

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_flags =
    -Itest/stubs
    -Ilib/button
    -Ilib/ioMapping_ardustyle
    -Ilib/metronome
    -Ilib/lcd_wrapper
